name = "task"

# The task zip ships a *path* require against a local mathlib checkout.
# To build elsewhere, either clone mathlib4 at tag v4.33.0-rc1 and point this
# path at it, or replace the block with:
#   [[require]]
#   name = "mathlib"
#   git = "https://github.com/leanprover-community/mathlib4"
#   rev = "v4.33.0-rc1"
[[require]]
name = "mathlib"
path = "/home/user/leanlib/mathlib4-433"

[[lean_lib]]
name = "Task"
